[project]
name = "maplelens"
version = "0.1.0"
description = "Screen-reading-only overlay for MapleStory Classic."
readme = "README.md"
license = "MIT"
authors = [{ name = "or-keren" }]
requires-python = ">=3.12"
dependencies = [
    "pyobjc-framework-cocoa>=13.0; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=13.0; sys_platform == 'darwin'",
    "pyobjc-framework-vision>=13.0; sys_platform == 'darwin'",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pyside6>=6.12.0",
    "winrt-windows-graphics>=4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-windows-graphics-capture>=4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-windows-graphics-capture-interop>=4.0.0; sys_platform == 'win32'",
    "winrt-windows-graphics-directx>=4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-windows-graphics-directx-direct3d11-interop>=4.1.0; sys_platform == 'win32'",
    "winrt-windows-globalization>=4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-windows-graphics-imaging>=4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-windows-media-ocr>=4!10.0.28000.2957; sys_platform == 'win32'",
    "winrt-windows-storage-streams>=4!10.0.28000.2957; sys_platform == 'win32'",
]

[project.scripts]
maplelens = "maplelens.app:main"

[dependency-groups]
build = ["pyinstaller>=6.22.3"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B",
    "C90",  # McCabe complexity
    "PL",   # pylint: too many branches/statements/args, misc smells
    "SIM",  # simplifiable code
    "C4",   # comprehensions
    "RET",  # return style
    "PIE",  # unnecessary code
    "PERF", # slow idioms
    "ARG",  # unused arguments
    "N",    # naming
    "RUF",  # ruff's own
]
ignore = [
    "PLR2004",  # magic numbers: pixel offsets and thresholds are the domain here
    "PLR0911",  # guard-clause ladders read better than split helpers; C901 covers branching
    "PLC0415",  # platform modules are imported inside functions on purpose
]

[tool.ruff.lint.per-file-ignores]
# fakes mirror Qt/pyobjc names and signatures; test factories take many fields
# RUF001: OCR misreads (dotless i) are the test data; SIM300: asserts on UPPER module constants
"tests/**" = ["ARG", "N802", "N815", "PLR0913", "PLR0917", "RUF001", "SIM300"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["*Event"]  # Qt event overrides
