# Publishes MapleLens-Setup-X.Y.Z.exe when main holds a version that has no vX.Y.Z tag yet.
# Merging the PR from prepare-release.yml is the usual way that happens. A failure in any
# step before the last one creates no tag and no release.
# Every installed MapleLens runs what this publishes, so the job that runs the checks and
# the build (downloaded packages, tools and hooks) can only read the repo. Only `publish`,
# which runs nothing but gh, can write. Actions are pinned to commits, not tags.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

# One release run at a time, so two pushes can't race to the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      released: ${{ steps.read.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # exit code 2: no such tag. Anything else non-zero (a network error) fails the
          # job rather than rebuilding a version that may be released already.
          code=0
          git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null || code=$?
          if [ "$code" -eq 0 ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released, nothing to do"
          elif [ "$code" -eq 2 ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "v$version has no tag yet: releasing it"
          else
            echo "::error::couldn't list the tags (git ls-remote exited $code)"
            exit 1
          fi

  build:
    needs: version
    if: needs.version.outputs.released == 'false'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --version 6.7.1 --no-progress -y
          }
      - run: uv sync --locked --group build
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run python scripts/check_screen_only.py
      - run: uv run pytest
      - run: uv run --group build python scripts/build_installer.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setup
          path: dist/MapleLens-Setup-${{ env.VERSION }}.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: setup
          path: dist
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
        # gh uploads the exe to a draft and publishes it (creating the tag) only after
        # the upload succeeds, so a failed upload leaves no tag
        run: >-
          gh release create "v$VERSION" "dist/MapleLens-Setup-$VERSION.exe"
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "MapleLens $VERSION" --generate-notes
